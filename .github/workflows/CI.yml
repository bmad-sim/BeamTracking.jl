name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.platform.version }} - ${{ matrix.platform.os }} - ${{ matrix.platform.arch }} - ${{ matrix.group }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    env:
      BEAMTRACKING_TEST_GROUP: ${{ matrix.group }}
      # The suite is ~94% compile time, so the julia-runtest defaults are
      # expensive: coverage costs 1.33x, check_bounds: yes 2.25x, both 3.0x.
      # Neither one finds anything platform-specific, so both run on a single
      # platform; Codecov merges that platform's per-group uploads into one
      # report, and bounds checking still covers every test once per commit.
      INSTRUMENTED: ${{ matrix.platform.version == 'lts' && matrix.platform.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Sharded so no single job carries the whole suite; the symplectic
        # group alone was 58% of the old wall time.
        group:
          - symplectic
          - batch_time
          - core
        # Every platform the suite ran on before, spelled out as one axis so it
        # cross-products with `group`. An `include:` block cannot be used here:
        # its entries conflict on os/version/arch, so GitHub adds them as
        # standalone combinations with no `group` key.
        platform:
          - {os: ubuntu-latest, arch: x64, version: 'lts'}
          - {os: ubuntu-latest, arch: x64, version: '1.11'}
          - {os: ubuntu-latest, arch: x64, version: '1.12'}
          - {os: ubuntu-24.04-arm, arch: aarch64, version: 'lts'}
          - {os: ubuntu-24.04-arm, arch: aarch64, version: '1.11'}
          - {os: ubuntu-24.04-arm, arch: aarch64, version: '1.12'}
          - {os: macos-latest, arch: aarch64, version: 'lts'}
          - {os: macos-latest, arch: aarch64, version: '1.11'}
          - {os: macos-latest, arch: aarch64, version: '1.12'}
          - {os: windows-latest, arch: x64, version: 'lts'}
          - {os: windows-latest, arch: x64, version: '1.11'}
          - {os: windows-latest, arch: x64, version: '1.12'}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.platform.version }}
          arch: ${{ matrix.platform.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ env.INSTRUMENTED }}
          check_bounds: ${{ env.INSTRUMENTED == 'true' && 'yes' || 'auto' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: env.INSTRUMENTED == 'true'
      - uses: codecov/codecov-action@v7
        if: env.INSTRUMENTED == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
