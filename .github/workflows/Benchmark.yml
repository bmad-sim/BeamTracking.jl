name: Benchmark
# Runs benchmark/benchmarks.jl for this PR and its base branch on the same runner, so that the
# timings are comparable (absolute timings depend on the hardware). The results table is written
# to the job summary. The hardware-independent performance checks are in test/performance_test.jl.
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true'
          extra-pkgs: 'Beamlines'
          # Benchmark both revisions with this PR's benchmark script
          script: 'benchmark/benchmarks.jl'
